name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      MAVEN_VERSION: 3.9.16
      MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          base="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSLO "$base/$archive"
          echo "${MAVEN_SHA512}  $archive" | sha512sum -c -
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check the tag
        run: |
          echo "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          revision=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' pom.xml)
          [ "${version%%.*}" = "${revision%%.*}" ] \
            || { echo "Tag ${GITHUB_REF_NAME} does not match major version ${revision%%.*} of the pom"; exit 1; }
          branch="release/${version%%.*}.x"
          tip=$(git ls-remote origin "refs/heads/${branch}" | cut -f1)
          [ -n "$tip" ] \
            || { echo "Branch ${branch} does not exist, create it before tagging ${GITHUB_REF_NAME}"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$tip" ] \
            || { echo "Tag ${GITHUB_REF_NAME} is not on the head of ${branch} (${tip}), push the branch before the tag"; exit 1; }

      - name: Publish
        run: |
          mvn -v | grep -qF "Apache Maven ${MAVEN_VERSION} "
          mvn -B -Prelease -Drevision="${GITHUB_REF_NAME#v}" \
            -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)" deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Keep the bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore

  github-release:
    name: Draft the GitHub release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft the release
        run: |
          highest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}" 'v*.*.*' \
            | sed 's|.*refs/tags/||' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          latest=$([ "$highest" = "$GITHUB_REF_NAME" ] && echo true || echo false)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" --draft
          {
            echo "The bundle is validated on Central but not published yet."
            echo "Publish it in the Central portal, then publish the draft release:"
            echo
            echo "    gh release edit $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --draft=false --latest=$latest"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
