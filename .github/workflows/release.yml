name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the tag
        run: |
          echo "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          revision=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' pom.xml)
          [ "${version%%.*}" = "${revision%%.*}" ] \
            || { echo "Tag ${GITHUB_REF_NAME} does not match major version ${revision%%.*} of the pom"; exit 1; }

      - name: Publish
        run: mvn -B -Prelease -Drevision="${GITHUB_REF_NAME#v}" deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Keep the bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
