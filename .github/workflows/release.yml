name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Maven 3.9.16
        run: |
          cd "$RUNNER_TEMP"
          base=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries
          archive=apache-maven-3.9.16-bin.tar.gz
          curl -fsSLO "$base/$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" \
            | sha512sum -c -
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Check the tag
        run: |
          echo "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          revision=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' pom.xml)
          [ "${version%%.*}" = "${revision%%.*}" ] \
            || { echo "Tag ${GITHUB_REF_NAME} does not match major version ${revision%%.*} of the pom"; exit 1; }
          branch="release/${version%%.*}.x"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" \
            || { echo "Tag ${GITHUB_REF_NAME} is not on ${branch}"; exit 1; }

      - name: Publish
        run: |
          mvn -v | grep -q '^Apache Maven 3\.9\.16 '
          mvn -B -Prelease -Drevision="${GITHUB_REF_NAME#v}" deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Keep the bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
